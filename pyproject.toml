[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlm-lsp"
version = "0.1.0"
description = "Language Server Protocol backend for .dlm files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "mfwolffe", email = "mfwolffe@outlook.com" }]
dependencies = [
    "dlm",
    "pygls>=1.3",
    "lsprotocol>=2024.0",
]

[tool.uv.sources]
dlm = { path = "../..", editable = true }

[project.scripts]
dlm-lsp = "dlm_lsp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dlm_lsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "C4", "SIM", "PT", "RET", "PTH", "TID"]

[tool.ruff.lint.per-file-ignores]
"src/dlm_lsp/server.py" = ["ARG001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]
